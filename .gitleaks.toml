title = "Gitleaks Configuration for wikijs-infra"

[extend]
# Use default gitleaks rules as base
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API Key"
regex = '''sk-or-v1-[a-zA-Z0-9]{32,}'''
tags = ["key", "openrouter"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)['":\s]*[=:]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["key", "api"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'''
tags = ["token", "jwt"]

[[rules]]
id = "database-password"
description = "Database Password in Connection String"
regex = '''(?i)(postgres|postgresql|mysql)://[^:]+:([^@\s]+)@'''
tags = ["password", "database"]

[allowlist]
description = "Allowlist for false positives"
paths = [
  '''.env.example''',
  '''docs/.*\.md''',
  '''README\.md''',
]

# Allow example/placeholder values
regexes = [
  '''ChangeMe123!''',
  '''your-api-key-here''',
  '''sk-or-v1-YOUR-KEY-HERE''',
  '''admin@wiki\.local''',
  '''wikijs123''',
]
